name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w \
              -X rssam/internal/version.Version=${VERSION} \
              -X rssam/internal/version.Commit=${COMMIT} \
              -X rssam/internal/version.Date=${DATE}" \
            -o dist/rssam ./cmd/rssam
          tar -C dist -czf dist/rssam-linux-amd64.tar.gz rssam
          sha256sum dist/rssam-linux-amd64.tar.gz | awk '{print $1}' > dist/rssam-linux-amd64.tar.gz.sha256
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rssam-linux-amd64.tar.gz
            dist/rssam-linux-amd64.tar.gz.sha256
