name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only token by default; no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod / go.sum are tidy and verified
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      # staticcheck and govulncheck are pinned through the tool directive in
      # go.mod, so CI runs the same versions as a developer's `go tool`.
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: Test (race, shuffled)
        run: go test -race -shuffle=on -count=1 ./...
      - name: Coverage summary
        run: |
          go test -count=1 -coverprofile=coverage.out ./... >/dev/null
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: govulncheck
        run: go tool govulncheck ./...

  # Runs the storage layer against a real PostgreSQL (the -tags=integration
  # tests do not execute in the unit job).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rssam
          POSTGRES_PASSWORD: rssam
          POSTGRES_DB: rssam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rssam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rssam:rssam@localhost:5432/rssam?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Migrations apply on a clean database
        run: go run ./cmd/rssam -migrate
      - name: Integration tests (storage + e2e pipeline)
        run: go test -tags=integration -count=1 ./internal/storage/... ./internal/e2e/...
      - name: Fresh-install smoke (admin bootstrap + UI login)
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=rssam psql -h localhost -U rssam -d rssam -v ON_ERROR_STOP=1 \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'rssam_smoke' AND pid <> pg_backend_pid();" \
            -c "DROP DATABASE IF EXISTS rssam_smoke;" \
            -c "CREATE DATABASE rssam_smoke;"
          go build -o /tmp/rssam ./cmd/rssam
          DATABASE_URL='postgres://rssam:rssam@localhost:5432/rssam_smoke?sslmode=disable' \
            LISTEN_ADDR=127.0.0.1:8090 RUN_MIGRATIONS=true UI_ENABLED=true \
            CSRF_SECRET=ci-csrf-secret-not-for-prod \
            ADMIN_USERNAME=admin ADMIN_PASSWORD=changeme-ci-123 LOG_LEVEL=error \
            /tmp/rssam >/tmp/rssam.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8090/healthz >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then echo "rssam did not become healthy"; cat /tmp/rssam.log; exit 1; fi
          csrf=$(curl -s -c /tmp/cj http://127.0.0.1:8090/ui/login | grep -o 'name="csrf_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"//')
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/cj -c /tmp/cj \
            -d "csrf_token=$csrf&username=admin&password=changeme-ci-123" http://127.0.0.1:8090/ui/login)
          echo "login status: $code"; tail -20 /tmp/rssam.log
          [ "$code" = "302" ]
