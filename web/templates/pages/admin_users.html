{{define "body_admin_users"}}
<div class="settings-layout">
  {{template "settings_nav" .}}
  <div class="settings-content">
    <h1>Пользователи</h1>
    <form method="post" action="/ui/admin/users" class="card">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="form-group"><label>Имя</label><input name="username" required></div>
      <div class="form-group"><label>Пароль</label><input name="password" type="password" required minlength="8"></div>
      <div class="form-group"><label><input type="checkbox" name="is_admin" value="1"> Admin</label></div>
      <button type="submit" class="btn btn-primary">Создать</button>
    </form>
    <table>
      <thead><tr><th>ID</th><th>Имя</th><th>Admin</th><th></th></tr></thead>
      <tbody>
      {{range .Users}}
      <tr>
        <td>{{.ID}}</td>
        <td>{{.Username}}</td>
        <td>{{if .IsAdmin}}да{{else}}нет{{end}}</td>
        <td>{{if ne .ID $.CurrentUserID}}<form method="post" action="/ui/admin/users/{{.ID}}/delete" onsubmit="return confirm('Удалить?')"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><button class="btn btn-sm btn-danger">×</button></form>{{end}}</td>
      </tr>
      {{end}}
      </tbody>
    </table>
    <form method="post" action="/ui/admin/feeds/refresh-all" style="margin-top:2rem"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button class="btn btn-primary">Обновить все ленты</button></form>
  </div>
</div>
{{end}}
