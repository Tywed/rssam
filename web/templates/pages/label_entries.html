{{define "body_label_entries"}}
<div class="headlines-toolbar">
  <h1 class="headlines-title" data-label-color="{{.Label.ID}}"><span class="label-badge">{{.Label.Caption}}</span></h1>
  <div class="headlines-actions">
    <form method="post" action="/ui/labels/{{.Label.ID}}/mark-read"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button class="btn btn-sm">Прочитать метку</button></form>
  </div>
</div>
{{template "entry_list" .}}
{{end}}
