{{define "body_unread"}}
<div id="ws-enabled" class="hidden"></div>
<div class="headlines-toolbar">
  <h1 class="headlines-title">Непрочитанные</h1>
  <div class="headlines-actions">
    {{if and (not .FeedID) (not .CategoryID)}}<form method="post" action="/ui/unread/mark-read"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button class="btn btn-sm">Прочитать все</button></form>{{end}}
    {{if .FeedID}}<form method="post" action="/ui/feeds/{{.FeedID}}/mark-read"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button class="btn btn-sm">Прочитать ленту</button></form>{{end}}
    {{if .CategoryID}}<form method="post" action="/ui/categories/{{.CategoryID}}/mark-read"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button class="btn btn-sm">Прочитать категорию</button></form>{{end}}
  </div>
</div>
{{template "entry_list" .}}
{{end}}
