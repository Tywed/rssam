{{define "app_header"}}
<header class="app-header">
  <button type="button" class="btn-icon feeds-toggle" id="feeds-toggle" title="Показать/скрыть ленты" aria-label="Ленты">☰</button>
  <a href="/ui/unread" class="app-logo">rssam</a>
  <form class="header-search" method="get" action="/ui/search">
    <input type="search" name="q" value="{{.SearchQuery}}" placeholder="Поиск записей…" aria-label="Поиск">
  </form>
  <div class="header-actions">
    <div class="view-mode-group" title="Режим просмотра">
      <button type="button" class="btn-icon view-mode-btn" data-view-mode="horizontal" title="Горизонтально: список | статья">▥</button>
      <button type="button" class="btn-icon view-mode-btn" data-view-mode="vertical" title="Вертикально: список над статьёй">▤</button>
    </div>
    <div class="entry-sort-group" title="Сортировка записей">
      <button type="button" class="btn-icon entry-sort-btn" data-entry-sort="newest" title="Сначала новые">↓</button>
      <button type="button" class="btn-icon entry-sort-btn" data-entry-sort="oldest" title="Сначала старые">↑</button>
    </div>
    <button type="button" class="btn-icon auto-read-btn" id="auto-read-toggle" title="Отмечать запись прочитанной при открытии" aria-pressed="false">✓</button>
    <button type="button" class="btn-icon" id="keys-toggle" title="Горячие клавиши" aria-label="Горячие клавиши">?</button>
    <button type="button" class="btn-icon theme-toggle" id="theme-toggle" title="Светлая/тёмная тема" aria-label="Тема">🌙</button>
    <a href="/ui/settings" class="btn btn-header {{if eq .Nav "settings"}}active{{end}}">⚙ Настройки</a>
    <span class="header-user" title="Пользователь">{{.Username}}</span>
    <form method="post" action="/ui/logout" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button type="submit" class="btn btn-logout">Выйти</button>
    </form>
  </div>
</header>
<dialog class="keys-dialog" id="keys-dialog">
  <h2>Горячие клавиши</h2>
  <dl>
    <dt><kbd>j</kbd> / <kbd>↓</kbd></dt><dd>следующая запись</dd>
    <dt><kbd>k</kbd> / <kbd>↑</kbd></dt><dd>предыдущая запись</dd>
    <dt><kbd>Enter</kbd></dt><dd>открыть выбранную</dd>
    <dt><kbd>m</kbd></dt><dd>отметить прочитанной</dd>
    <dt><kbd>x</kbd></dt><dd>выбрать / снять выбор</dd>
    <dt><kbd>n</kbd> / <kbd>→</kbd></dt><dd>следующая лента</dd>
    <dt><kbd>p</kbd> / <kbd>←</kbd></dt><dd>предыдущая лента</dd>
    <dt><kbd>?</kbd></dt><dd>эта подсказка</dd>
  </dl>
  <form method="dialog"><button class="btn btn-sm">Закрыть</button></form>
</dialog>
{{end}}
